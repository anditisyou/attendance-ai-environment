name: attendance-env
description: >
  A simulated student attendance validation environment where an AI agent
  decides whether to mark a student present, absent, or suspicious based on
  location, time, and identity.

version: 1.0

entrypoint: attendance_env:AttendanceEnv

tasks:
  - name: easy
    description: Student is correctly present in classroom on time.
  - name: medium
    description: Student is not in classroom or has minor issues.
  - name: hard
    description: Includes late entries, wrong locations, and unknown students.

action_space:
  type: discrete
  values:
    - mark_present
    - mark_absent
    - flag_suspicious

observation_space:
  type: dict
  fields:
    name: string
    location: string
    time: string

reward_range: [-1.0, 1.0]