[project]
name = "attendance-ai-environment"
version = "0.1.0"
description = "AI-powered attendance validation environment"
authors = [
    { name = "Vaishnavi Khandelwal" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "plotly",
    "openenv>=0.2.0"
]

[project.scripts]
server = "server.app:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
